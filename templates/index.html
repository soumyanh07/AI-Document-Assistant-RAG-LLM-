<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Document Assistant</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <main>
      <section class="hero">
        <h1>AI Document Assistant</h1>
        <p>Upload documents, ask questions, and get grounded answers from your own files.</p>
      </section>

      <section class="panel">
        <h2>1. Upload documents</h2>
        <form id="uploadForm" enctype="multipart/form-data">
          <input type="file" id="files" name="files" multiple required />
          <button type="submit">Upload</button>
        </form>
        <p id="uploadStatus">No documents yet.</p>
      </section>

      <section class="panel">
        <h2>2. Ask a question</h2>
        <form id="chatForm">
          <input id="question" name="question" placeholder="What is in these documents?" required />
          <button type="submit">Ask</button>
        </form>
        <div id="messages" class="messages"></div>
      </section>
    </main>

    <script src="/static/app.js"></script>
  </body>
</html>
