<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Document Assistant</title>
    <link rel="icon" type="image/png" href="/static/favicon.png" />
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <main>
      <section class="hero">
        <div>
          <h1>AI Document Assistant</h1>
          <p>Upload your documents, ask questions, and get answers grounded in your own files.</p>
        </div>
        <div class="hero-meta">
          <strong>Tip:</strong> The assistant works fully offline using your uploaded documents.
        </div>
      </section>

      <section class="grid-panel">
        <article class="panel upload-panel">
          <h2>1. Upload documents</h2>
          <form id="uploadForm" enctype="multipart/form-data">
            <label class="file-picker">
              <span>Select one or more files</span>
              <input type="file" id="files" name="files" multiple required />
            </label>
            <button type="submit">Upload</button>
          </form>
          <p id="uploadStatus" class="status-text">No documents uploaded yet.</p>
        </article>

        <article class="panel chat-panel">
          <h2>2. Ask a question</h2>
          <form id="chatForm">
            <input id="question" name="question" placeholder="Ask something from the uploaded documents" required />
            <button type="submit">Ask Assistant</button>
          </form>
          <div id="messages" class="messages"></div>
        </article>
      </section>
    </main>

    <script src="/static/app.js"></script>
  </body>
</html>
